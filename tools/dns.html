<!DOCTYPE html>
<html>
<head>
    <title>Online DNS resolver</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script type="text/javascript" src="module.js"></script>
    <script type="text/javascript">
        function arrayBufferToHexDump(arrayBuffer) {
        const bytesPerRow = 16;
        let hexDump = '';
        let byteArray = new Uint8Array(arrayBuffer);

        for (let i = 0; i < byteArray.length; i += bytesPerRow) {
            // Extract a slice of bytes and convert each byte to a hex string
            let rowBytes = byteArray.slice(i, i + bytesPerRow);
            let hexValues = Array.from(rowBytes).map(byte => byte.toString(16).padStart(2, '0'));

            // Pad the hex values for the last line if necessary
            if (hexValues.length < bytesPerRow) {
                hexValues = [...hexValues, ...Array(bytesPerRow - hexValues.length).fill('  ')];
            }

            // Optionally, add ASCII representation
            let asciiRepresentation = Array.from(rowBytes).map(byte => {
                return byte >= 32 && byte <= 126 ? String.fromCharCode(byte) : '.';
            }).join('');

            // Combine hex values and ASCII representation for the row
            hexDump += `${hexValues.join(' ')}  ${asciiRepresentation}\n`;
        }

        return hexDump.trim();
    }

    window.addEventListener("load", () => {
        document.getElementById("resendBtn").addEventListener("click", async () => {
            let request = JSON.parse(document.getElementById("aJsonReq").value);
            console.log(request.questions[0].name);
            let buf = dnsPacket.encode(request);
            document.getElementById("aHexDumpReq").textContent = arrayBufferToHexDump(buf);
            console.log(buf.toString("base64"));
            let x = await fetch("https://mozilla.cloudflare-dns.com/dns-query?dns="+buf.toString("base64"));

            let resp = await x.arrayBuffer();
            let buffer = Buffer.from(resp);
            document.getElementById("aJson").textContent = JSON.stringify(dnsPacket.decode(buffer), null, 4);
            document.getElementById("aHexDump").textContent = arrayBufferToHexDump(resp);
            console.log("done");
        });
        document.getElementById("resolveBtn").addEventListener("click", () => {
            let url = new URL(location)
            let domain = document.getElementById("dnsInput").value;
            let type = document.getElementById("queryType").value;
            url.searchParams.set("dns", domain);
            url.searchParams.set("type", type);
            history.pushState({}, "", url);

            async function request(domain, type, jsonId, hexId) {
                console.log(domain);
                let request = {
                  type: 'query',
                  id: 0,
                  flags: dnsPacket.RECURSION_DESIRED,
                  questions: [{
                    type: type,
                    name: domain
                  }]
                };
                console.log(request);
                let buf = dnsPacket.encode(request);
                document.getElementById("aJsonReq").textContent = JSON.stringify(request, null, 4);
                document.getElementById("aHexDumpReq").textContent = arrayBufferToHexDump(buf);
                let x = await fetch("https://mozilla.cloudflare-dns.com/dns-query?dns="+buf.toString("base64"));
                let resp = await x.arrayBuffer();
                let buffer = Buffer.from(resp);
                document.getElementById(jsonId).textContent = JSON.stringify(dnsPacket.decode(buffer), null, 4);

                document.getElementById(hexId).textContent = arrayBufferToHexDump(resp);
            }
            request(domain, type, "aJson", "aHexDump");
        });

        let params = new URL(document.location).searchParams;
        if (params.get("type")) {
            document.getElementById("queryType").value = params.get("type");
        }
        if (params.get("dns")) {
            document.getElementById("dnsInput").value = params.get("dns");
            document.getElementById("resolveBtn").click();
        }
    });

    </script>
</head>
<body>
    <div class="container">
        <h1>DNS Resolver</h1>
        <input type="text" id="dnsInput" class="dnsInput" placeholder="Enter DNS name">
        <input type="text" id="queryType" class="dnsInput" placeholder="Query type">
        <button id="resolveBtn" class="btn">Resolve</button>
        <div id="responseA" class="response">
            <h2>Request</h2>
            <textarea id="aJsonReq" class="like-pre" rows="20"></textarea>
            <pre id="aHexDumpReq"></pre>
            <button id="resendBtn" class="btn">Resend</button>
        </div>
        <div id="responseA" class="response">
            <h2>Response</h2>
            <pre id="aJson"></pre>
            <pre id="aHexDump"></pre>
        </div>
    </div>
</body>
</html>
